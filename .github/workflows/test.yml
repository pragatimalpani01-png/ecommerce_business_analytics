name: project-checks
on:
  push:
  pull_request:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python run_project.py --source demo
      - run: python -m unittest discover -s tests -v
